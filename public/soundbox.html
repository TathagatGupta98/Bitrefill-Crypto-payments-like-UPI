<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1a16">
  <title>Sikka Soundbox</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="soundbox-page">
  <main class="soundbox">
    <div class="soundbox-top">
      <div class="brand"><img src="/logo.svg" alt="" width="28" height="28">Sikka</div>
      <span id="status" class="pill" hidden><span class="dot"></span><span id="listening">Listening…</span></span>
    </div>

    <div class="soundbox-main">
      <h1 id="shop-name">Soundbox</h1>

      <div id="setup">
        <p class="soundbox-hint">Keep this page open near your counter, with the volume up.</p>
        <button id="start" class="primary">🔊 Tap to start soundbox</button>
      </div>

      <div id="live" hidden>
        <div class="coin-pulse"><img src="/logo.svg" alt="" width="112" height="112"></div>
        <div class="today-card">
          <p class="today-label">Today</p>
          <p id="today" class="today"></p>
        </div>
        <ul id="recent" class="recent"></ul>
        <button id="test-sound" class="link test-sound">Test sound</button>
      </div>
    </div>
  </main>

  <div id="hit" class="hit" hidden>
    <img src="/logo.svg" alt="" width="96" height="96">
    <p id="flash" class="flash" hidden></p>
    <p class="hit-line">क्रिप्टो से प्राप्त हुए</p>
  </div>

  <script>
    const FLASH_MS = 6000;
    const SPEECH_DELAY_MS = 700;
    const MAX_RECENT = 5;
    const slug = location.pathname.split('/')[2];
    const $ = (id) => document.getElementById(id);
    const rupees = (inr) => `₹${inr.toLocaleString('en-IN')}`;
    let audio;
    let flashTimer;

    async function refreshToday() {
      const res = await fetch(`/api/shops/${slug}/summary`);
      if (!res.ok) {
        $('shop-name').textContent = 'Shop not found';
        $('setup').hidden = true;
        return false;
      }
      const { name, todayInr, todayCount } = await res.json();
      $('shop-name').textContent = name;
      $('today').textContent = `${rupees(todayInr)} · ${todayCount} sale${todayCount === 1 ? '' : 's'}`;
      return true;
    }

    function chime() {
      [880, 1175].forEach((frequency, index) => {
        const start = audio.currentTime + index * 0.18;
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.frequency.value = frequency;
        gain.gain.setValueAtTime(0.4, start);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);
        osc.connect(gain).connect(audio.destination);
        osc.start(start);
        osc.stop(start + 0.35);
      });
    }

    function speak(amountInr) {
      // Hindi voices read Devanagari far better, but other voices can't read it at all.
      const voice = speechSynthesis.getVoices().find((candidate) => candidate.lang.replace('_', '-') === 'hi-IN');
      const utterance = new SpeechSynthesisUtterance(
        voice ? `क्रिप्टो से ${amountInr} रुपये प्राप्त हुए` : `crypto se ${amountInr} rupaye prapt hue`,
      );
      utterance.lang = 'hi-IN';
      if (voice) utterance.voice = voice;
      speechSynthesis.speak(utterance);
    }

    function addRecent(amountInr) {
      const item = document.createElement('li');
      const time = document.createElement('time');
      time.textContent = new Date().toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
      const amount = document.createElement('strong');
      amount.textContent = `+ ${rupees(amountInr)}`;
      item.append(time, amount);
      $('recent').prepend(item);
      $('recent').querySelectorAll(`li:nth-child(n + ${MAX_RECENT + 1})`).forEach((old) => old.remove());
    }

    function announce(amountInr) {
      chime();
      setTimeout(() => speak(amountInr), SPEECH_DELAY_MS);

      $('flash').textContent = `+ ${rupees(amountInr)}`;
      $('flash').hidden = false;
      $('hit').hidden = false;
      clearTimeout(flashTimer);
      flashTimer = setTimeout(() => {
        $('hit').hidden = true;
        $('flash').hidden = true;
      }, FLASH_MS);
    }

    async function keepScreenOn() {
      try {
        await navigator.wakeLock?.request('screen');
      } catch {
        // Not supported everywhere, and the soundbox still works without it.
      }
    }

    function listen() {
      const source = new EventSource(`/api/shops/${slug}/events`);
      // Also runs after a reconnect, in case a sale came in while the connection was down.
      source.onopen = () => {
        $('listening').textContent = 'Listening…';
        $('status').classList.remove('is-off');
        refreshToday();
      };
      source.onerror = () => {
        $('listening').textContent = 'Reconnecting…';
        $('status').classList.add('is-off');
      };
      source.onmessage = (message) => {
        const event = JSON.parse(message.data);
        if (event.type !== 'delivered') return;
        announce(event.amountInr);
        addRecent(event.amountInr);
        refreshToday();
      };
    }

    // Browsers only allow sound after a tap, so everything audio starts here.
    $('start').addEventListener('click', () => {
      audio = new AudioContext();
      audio.resume();
      speechSynthesis.getVoices();
      speechSynthesis.speak(new SpeechSynthesisUtterance(''));
      keepScreenOn();
      $('setup').hidden = true;
      $('live').hidden = false;
      $('status').hidden = false;
      listen();
    });
    $('test-sound').addEventListener('click', () => announce(100));
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && audio) keepScreenOn();
    });

    refreshToday();
  </script>
</body>
</html>
