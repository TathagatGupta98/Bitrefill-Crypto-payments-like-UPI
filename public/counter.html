<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1a16">
  <title>Sikka QR</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="soundbox-page">
  <main class="soundbox">
    <div class="soundbox-top">
      <div class="brand"><img src="/logo.svg" alt="" width="28" height="28">Sikka</div>
      <span id="lang-slot"></span>
      <span id="status" class="pill"><span class="dot"></span><span id="listening">Connecting…</span></span>
    </div>

    <div class="soundbox-main">
      <h1 id="shop-name"><span class="skeleton counter-skeleton"></span></h1>
      <p class="counter-line">Scan to pay with crypto · USDC</p>

      <div id="qr-wrap" class="counter-qr-wrap" hidden>
        <img id="qr" class="counter-qr" alt="QR code to pay this shop" width="800" height="800">
      </div>

      <button id="sound-on" class="primary counter-sound" hidden>🔊 Tap to turn on sound</button>
      <p id="sound-ready" class="counter-note" hidden>🔊 Sound on. Keep this page open with the volume up.</p>

      <div id="tools" class="counter-tools" hidden>
        <button id="test-sound" class="link test-sound">Test sound</button>
        <a id="print-standee" class="link test-sound" target="_blank" rel="noopener">Print standee</a>
      </div>

      <details id="today-panel" class="today-panel" hidden>
        <summary>Today's sales</summary>
        <div class="today-card">
          <p id="today" class="today"></p>
        </div>
        <ul id="recent" class="recent"></ul>
      </details>
    </div>
  </main>

  <div id="hit" class="hit" hidden>
    <img src="/mascot/happy.svg" alt="" width="150" height="158">
    <p id="flash" class="flash" hidden></p>
    <p class="hit-line no-translate">क्रिप्टो से प्राप्त हुए</p>
    <p class="hit-line hit-line-en no-translate">received in crypto</p>
  </div>

  <script src="/i18n.js"></script>
  <script>
    const FLASH_MS = 6000;
    const SPEECH_DELAY_MS = 700;
    const MAX_RECENT = 5;
    const slug = location.pathname.split('/')[2];
    const key = encodeURIComponent(new URLSearchParams(location.search).get('k') ?? '');
    const $ = (id) => document.getElementById(id);
    const rupees = (inr) => `₹${inr.toLocaleString('en-IN')}`;
    let audio = null;
    let flashTimer;

    async function refreshToday() {
      const res = await fetch(`/api/shops/${slug}/summary?k=${key}`);
      if (!res.ok) {
        $('shop-name').textContent = t(res.status === 403 ? 'Open this link from your Telegram chat' : 'Shop not found');
        $('status').hidden = true;
        return false;
      }
      const { name, todayInr, todayCount } = await res.json();
      $('shop-name').textContent = name;
      document.title = name;
      $('today').textContent = `${rupees(todayInr)} · ${todayCount} ${t(todayCount === 1 ? 'sale' : 'sales')}`;
      return true;
    }

    function chime() {
      [880, 1175].forEach((frequency, index) => {
        const start = audio.currentTime + index * 0.18;
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.frequency.value = frequency;
        gain.gain.setValueAtTime(0.4, start);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);
        osc.connect(gain).connect(audio.destination);
        osc.start(start);
        osc.stop(start + 0.35);
      });
    }

    function speak(amountInr) {
      // Hindi voices read Devanagari far better, but other voices can't read it at all.
      const voice = speechSynthesis.getVoices().find((candidate) => candidate.lang.replace('_', '-') === 'hi-IN');
      const utterance = new SpeechSynthesisUtterance(
        voice ? `क्रिप्टो से ${amountInr} रुपये प्राप्त हुए` : `crypto se ${amountInr} rupaye prapt hue`,
      );
      utterance.lang = 'hi-IN';
      if (voice) utterance.voice = voice;
      speechSynthesis.speak(utterance);
    }

    function addRecent(amountInr) {
      const item = document.createElement('li');
      const time = document.createElement('time');
      time.textContent = new Date().toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
      const amount = document.createElement('strong');
      amount.textContent = `+ ${rupees(amountInr)}`;
      item.append(time, amount);
      $('recent').prepend(item);
      $('recent').querySelectorAll(`li:nth-child(n + ${MAX_RECENT + 1})`).forEach((old) => old.remove());
    }

    // The animation always plays. Sound needs one tap first, because browsers block it until then.
    function announce(amountInr) {
      if (audio) {
        chime();
        setTimeout(() => speak(amountInr), SPEECH_DELAY_MS);
      }
      navigator.vibrate?.(200);

      $('flash').textContent = `+ ${rupees(amountInr)}`;
      $('flash').hidden = false;
      $('hit').hidden = false;
      clearTimeout(flashTimer);
      flashTimer = setTimeout(() => {
        $('hit').hidden = true;
        $('flash').hidden = true;
      }, FLASH_MS);
    }

    async function keepScreenOn() {
      try {
        await navigator.wakeLock?.request('screen');
      } catch {
        // Not supported everywhere, and the page still works without it.
      }
    }

    function listen() {
      const source = new EventSource(`/api/shops/${slug}/events?k=${key}`);
      // Also runs after a reconnect, in case a sale came in while the connection was down.
      source.onopen = () => {
        $('listening').textContent = t('Live');
        $('status').classList.remove('is-off');
        refreshToday();
      };
      source.onerror = () => {
        $('listening').textContent = t('Reconnecting…');
        $('status').classList.add('is-off');
      };
      source.onmessage = (message) => {
        const event = JSON.parse(message.data);
        if (event.type !== 'delivered') return;
        announce(event.amountInr);
        addRecent(event.amountInr);
        refreshToday();
      };
    }

    function turnOnSound() {
      audio = new AudioContext();
      audio.resume();
      speechSynthesis.getVoices();
      speechSynthesis.speak(new SpeechSynthesisUtterance(''));
      keepScreenOn();
      $('sound-on').hidden = true;
      $('sound-ready').hidden = false;
      $('test-sound').hidden = false;
    }

    $('sound-on').addEventListener('click', turnOnSound);
    $('test-sound').addEventListener('click', () => announce(100));
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && audio) keepScreenOn();
    });

    refreshToday().then((ok) => {
      if (!ok) return;
      $('qr').src = `/qr/${slug}.png`;
      $('qr-wrap').hidden = false;
      $('sound-on').hidden = false;
      $('tools').hidden = false;
      $('test-sound').hidden = true;
      $('print-standee').href = `/standee/${slug}`;
      $('today-panel').hidden = false;
      listen();
    });
  </script>
</body>
</html>
